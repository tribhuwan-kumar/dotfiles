#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

# IPv4/IPv6 Simple & Safe firewall ruleset.
# More examples in /usr/share/nftables/ and /usr/share/doc/nftables/examples/.

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    ip protocol icmp accept comment "allow icmp"
    meta l4proto ipv6-icmp accept comment "allow icmp v6"
    tcp dport ssh accept comment "allow sshd"
    tcp dport 1714-1764 accept comment "allow KDE Connect TCP"
    udp dport 1714-1764 accept comment "allow KDE Connect UDP"
    udp dport 5353 accept comment "allow mdns avahi"
    tcp dport 9080 accept comment "allow arix"
    udp dport { 137, 138 } accept comment "allow samba"
    tcp dport { 139, 445 } accept comment "allow samba"
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter
    policy drop
    ct state { established, related } accept comment "allow tracked responses"
    iifname "podman*" accept comment "allow containers out to wan"
    oifname "podman*" accept comment "allow wan back to containers"
    iifname "docker*" accept comment "allow containers out to wan"
    oifname "docker*" accept comment "allow wan back to containers"
  }
}
